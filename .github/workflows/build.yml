name: Build StoreSync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract StoreSync project
        run: |
          ZIP_FILE="StoreSync_v6_Notes_Units_Updates.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository."
            echo "Please check that the ZIP file is uploaded."
            exit 1
          fi

          mkdir -p app-source
          unzip -q "$ZIP_FILE" -d app-source

          echo "Project files extracted successfully."

      - name: Configure Supabase key
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi

          CONFIG_FILE=$(find app-source -name "AppConfig.kt" -print -quit)

          if [ -z "$CONFIG_FILE" ]; then
            echo "ERROR: AppConfig.kt was not found."
            exit 1
          fi

          sed -i "s|SUPABASE_PUBLISHABLE_KEY_PLACEHOLDER|$SUPABASE_KEY|g" "$CONFIG_FILE"

      - name: Build StoreSync APK
        run: |
          cd app-source

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreSync-APK
          path: app-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

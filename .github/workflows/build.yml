
name: Build StoreSync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract StoreSync project
        run: |
          ZIP_FILE="StoreSync_v7_Splash_SwipeEditor.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: ZIP not found"; exit 1; }
          mkdir -p app-source
          unzip -q "$ZIP_FILE" -d app-source

      - name: Configure Supabase publishable key
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ.get("SUPABASE_KEY", "")
          if not key:
              raise SystemExit("Supabase key secret is missing")

          matches = list(Path("app-source").rglob("AppConfig.kt"))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one AppConfig.kt")

          path = matches[0]
          content = path.read_text()
          placeholder = "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE"

          if placeholder not in content:
              raise SystemExit("Key placeholder not found")

          path.write_text(content.replace(placeholder, key))
          print("Supabase key configured")

          PY

      - name: Build StoreSync APK
        run: |
          cd app-source
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreSync-APK
          path: app-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          

name: Build StoreSync APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract StoreSync project
        run: |
          ZIP_FILE="StoreSync_v6_Notes_Units_Updates.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository."
            exit 1
          fi

          mkdir -p app-source
          unzip -q "$ZIP_FILE" -d app-source

          echo "Project files extracted successfully."

      - name: Configure Supabase key
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ.get("SUPABASE_KEY", "")

          if not key:
              raise SystemExit(
                  "ERROR: SUPABASE_PUBLISHABLE_KEY is missing or empty."
              )

          config = Path(
              "app-source/app/src/main/java/com/storesync/app/AppConfig.kt"
          )

          if not config.is_file():
              raise SystemExit("ERROR: AppConfig.kt was not found.")

          content = config.read_text()

          placeholder = "PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE"

          if placeholder not in content:
              raise SystemExit(
                  "ERROR: Expected key placeholder was not found in AppConfig.kt."
              )

          content = content.replace(placeholder, key)
          config.write_text(content)

          print("Supabase publishable key configured successfully.")
          PY

      - name: Build StoreSync APK
        run: |
          cd app-source

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoreSync-APK
          path: app-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
